[project]
name = "sudoku-heuristics-project"
version = "0.1.0"
description = "Research project comparing heuristic Sudoku solving with programming and MIP baselines"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "gurobipy>=13.0",
    "pytest>=8.0",
    "ruff>=0.8"
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
